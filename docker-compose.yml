services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: voiceos
      POSTGRES_PASSWORD: voiceos
      POSTGRES_DB: voiceos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voiceos"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
