[project]
name = "voiceos-backend"
version = "0.1.0"
description = "VoiceOS api + worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.120,<1",
  "uvicorn[standard]>=0.38",
  "sqlalchemy>=2.0.40,<2.1",
  "alembic>=1.16",
  "pydantic-settings>=2.10",
  "psycopg[binary]>=3.2",
  "pyjwt[crypto]>=2.10",
  "email-validator>=2.2",
  "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.4", "httpx>=0.28", "ruff>=0.13"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["voiceos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres_only: needs PostgreSQL (runs in CI)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"voiceos/seed_demo.py" = ["E501"]  # sample dialogue strings
